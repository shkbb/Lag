[package]
name = "lag-update"
description = "Shows the update while the installer runs, then starts the updated Lag (shipped as LagUpdate.exe)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "LagUpdate"
path = "src/main.rs"

[dependencies]
# Lag's own splash window, compiled in (crates/lag-app/ui/splash.slint): the same look as Lag's startup
slint = { version = "1.18.1", default-features = false, features = [
    "std", "backend-winit", "renderer-femtovg", "compat-1-2",
] }
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Registry",
] }

[build-dependencies]
slint-build = "=1.18.1"
