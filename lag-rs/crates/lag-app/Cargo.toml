[package]
name = "lag-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# ONE [dependencies] table (Windows-only app). Packages: APPEND your crate or features inside this table;
# never add a second [dependencies]/[target.*.dependencies] table (duplicate keys break every cargo command).
[dependencies]
# Slint's default features minus "accessibility": its AccessKit layer panicked (RefCell BorrowMutError inside
# accesskit_windows::subclass::wnd_proc) when a window was shown while an accessibility client (ShareX, Narrator,
# UI-inspection tools) queried the main window - a hard crash on page switches (owner, 2026-11-18; minidump stack).
slint = { version = "1.18.1", default-features = false, features = [
    "std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2", "system-tray",
    "raw-window-handle-06", "unstable-winit-030",
] }
lag-core = { workspace = true }
lag-capture = { workspace = true }
lag-audio = { workspace = true }
lag-cloud = { path = "../lag-cloud" }
lag-cloud-drive = { path = "../lag-cloud-drive" }
log = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_System_Threading", "Win32_Security",
    "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_Shell",
    "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation",
    "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp", "Win32_UI_Input", "Win32_UI_Shell_Common",
] }
raw-window-handle = "0.6"
chrono = "0.4.45"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# shell-B: GNU-compatible tray, embedded ICO decoding, on-demand HTTP (worker threads only)
tray-icon = { version = "0.26.1", default-features = false }
muda = { version = "0.21.2", default-features = false }
ico = "0.6"

# player: libmpv rendering, GNU-compatible OpenGL bindings.
lag-player = { workspace = true }

# themes: the UI loaded from files at run time (src/ui_twin)
slint-interpreter = { version = "=1.18.1", features = ["internal", "internal-highlight"] }
# the theme editor reads and edits .slint sources (element nodes, bindings)
i-slint-compiler = "=1.18.1"
i-slint-core = "=1.18.1"
# theme packages: theme.toml manifests, .lagtheme files (zip)
toml = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { workspace = true }

[build-dependencies]
# the UI twin generator (build_twin.rs) reads the .slint types; "internal" = full type info, pinned exactly
slint-interpreter = { version = "=1.18.1", features = ["internal"] }
i-slint-compiler = "=1.18.1"
i-slint-core = "=1.18.1"

[dev-dependencies]
spin_on = "0.1"

[[bin]]
name = "Lag"
path = "src/main.rs"
