[package]
name = "lag-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true, features = ["std"] }
crossbeam-channel = { workspace = true }
chrono = "0.4.45"
md5 = "0.8.1"
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_Globalization",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_SystemInformation",
    "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Media_Audio",
    "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery",
] }

[dev-dependencies]
roxmltree = "0.21.1"
