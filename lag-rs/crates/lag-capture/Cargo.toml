[package]
name = "lag-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lag-ffi = { workspace = true }
lag-audio = { workspace = true }
log = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_System_Com", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging", "Security_Authorization_AppCapabilityAccess", "Win32_System_SystemInformation",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite",
    "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_UI_Accessibility",
    "Devices_Enumeration", "Media_Capture", "Media_Capture_Frames", "Media_MediaProperties",
    "Graphics_Imaging", "Storage_Streams",
] }
windows-future = "0.3"

windows-numerics = "0.3"

[dev-dependencies]
lag-core = { workspace = true }
